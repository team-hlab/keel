[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keel"
version = "0.1.0"
description = "A lean, cross-platform hook harness for first-party AI coding agents (Claude Code, Codex, Antigravity)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "hubtwork" }]
keywords = ["claude-code", "codex", "antigravity", "hooks", "permissions", "agent"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []   # zero third-party RUNTIME deps, by design

[project.optional-dependencies]
dev = ["ruff>=0.6"]   # dev-only: lint/format. Not a runtime dependency.

[project.scripts]
keel = "keel.cli:main"

[project.urls]
Homepage = "https://github.com/team-hlab/keel"

[tool.hatch.build.targets.wheel]
packages = ["src/keel"]

[tool.ruff]
line-length = 110
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]   # line length is the formatter's job; long regexes/strings are fine

[tool.ruff.lint.per-file-ignores]
# tests set sys.path via `import _bootstrap` before importing keel — don't let
# import-sorting reorder that, and allow imports below the path shim (E402).
"tests/**" = ["E402", "I001"]
