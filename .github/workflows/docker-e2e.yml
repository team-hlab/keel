name: docker-e2e

# Builds keel, runs the full install/attach/shim/uninstall lifecycle in a container
# against the REAL Claude/Codex CLIs (from the prebaked GHCR base; built inline if the
# base isn't published yet) and a stubbed Antigravity. Evidence (log + PNG) is uploaded
# as an artifact AND posted as a sticky PR comment.
on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read
  packages: read
  pull-requests: write
concurrency:
  group: docker-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build keel
        run: cargo build --release

      - uses: docker/setup-buildx-action@v3
      - name: login GHCR (registry cache source)
        uses: docker/login-action@v3
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Build the base from THIS revision's Dockerfile (so base changes in a PR are
      # tested), reusing unchanged layers from the published base + GHA cache → fast.
      - name: build base image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/base.Dockerfile
          tags: keel-e2e-base:latest
          load: true
          cache-from: |
            type=registry,ref=ghcr.io/team-hlab/keel-e2e-base:latest
            type=gha
          cache-to: type=gha,mode=max

      - name: run lifecycle e2e
        shell: bash
        run: |
          set -o pipefail
          docker run --rm \
            -v "$PWD/target/release/keel:/usr/local/bin/keel:ro" \
            -v "$PWD/docker/e2e.sh:/e2e.sh:ro" \
            keel-e2e-base:latest bash /e2e.sh 2>&1 | tee e2e-output.txt

      - name: evidence → step summary
        if: always()
        shell: bash
        run: |
          {
            echo '### keel docker e2e — real Claude Code + Codex + Antigravity (agy)'
            echo '```'
            cat e2e-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: evidence → render PNG (runner ImageMagick)
        if: always()
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends imagemagick fonts-dejavu-core
          convert -size 1200x -background '#11121a' -fill '#c8d3f5' \
            -font /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf -pointsize 17 \
            -bordercolor '#11121a' -border 28 \
            caption:"$(cat e2e-output.txt)" e2e-evidence.png || echo "png render skipped"

      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keel-e2e-evidence
          path: |
            e2e-output.txt
            e2e-evidence.png
          if-no-files-found: warn

      - name: evidence → sticky PR comment
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true # posting evidence must never fail a passing e2e (e.g. fork PRs)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          marker='<!-- keel-e2e -->'
          body=$(printf '%s\n## 🧪 keel docker e2e — real Claude + Codex + Antigravity (agy)\n\n```\n%s\n```\n\n📎 Full log + PNG photo: [run artifacts](%s)\n' \
                 "$marker" "$(cat e2e-output.txt)" "$RUN_URL")
          cid=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
                  --jq ".[] | select(.body|startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$cid" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${cid}" -f body="$body" >/dev/null && echo "updated PR comment $cid"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$body" >/dev/null && echo "created PR comment"
          fi
