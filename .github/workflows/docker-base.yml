name: docker-base

# Publishes the prebaked e2e base image (real agent CLIs) to GHCR so docker-e2e
# can pull it instead of installing the agents every run. Rebuilt when the base
# changes, on demand, and weekly (to pick up new agent CLI versions).
on:
  push:
    branches: [develop]
    paths:
      - docker/base.Dockerfile
      - .github/workflows/docker-base.yml
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  packages: write
concurrency:
  group: docker-base
  cancel-in-progress: false

jobs:
  publish-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/base.Dockerfile
          push: true
          tags: ghcr.io/team-hlab/keel-e2e-base:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
