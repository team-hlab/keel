name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --release --target ${{ matrix.target }}
      - name: package
        run: tar -C target/${{ matrix.target }}/release -czf keel-${{ matrix.target }}.tar.gz keel
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: keel-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # Render the Homebrew formula for this release and push it to the tap.
  # Requires a TAP_TOKEN secret with write access to team-hlab/homebrew-keel.
  bump-tap:
    needs: release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: render formula
        run: python3 packaging/homebrew/render_formula.py "${GITHUB_REF_NAME#v}"
      - name: push to tap
        if: ${{ env.GH_TOKEN != '' }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/team-hlab/homebrew-keel.git" tap
          mkdir -p tap/Formula
          cp packaging/homebrew/keel.rb tap/Formula/keel.rb
          cd tap
          git config user.name "keel-release"
          git config user.email "keel-release@users.noreply.github.com"
          git add Formula/keel.rb
          git commit -m "keel ${GITHUB_REF_NAME}" || exit 0
          git push
