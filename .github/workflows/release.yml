name: release

# Merge-triggered release: when a PR lands on develop and bumps the version in
# Cargo.toml, build the binaries, publish a GitHub Release, and update the Homebrew tap.
# A normal merge (no version change) is a no-op. Manual run available via workflow_dispatch.
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

# serialize releases so two quick merges can't race to publish the same tag
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -E '^version' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$version already released — nothing to do."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "v$version is new — releasing."
          fi

  build:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          # musl → a fully static Linux binary with no glibc floor (runs on any distro),
          # matching keel's "single static binary" promise. gnu linked against the runner's
          # glibc, which broke on older systems when ubuntu-latest bumped to 2.39.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target ${{ matrix.target }}
      - run: tar -C target/${{ matrix.target }}/release -czf keel-${{ matrix.target }}.tar.gz keel
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: keel-*.tar.gz

  release:
    needs: [gate, build]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # only this job creates the tag + release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.gate.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true

  # Update the Homebrew tap. Mints a SHORT-LIVED token from a GitHub App scoped to only
  # team-hlab/homebrew-keel (no standing PAT) — see docs/RELEASING.md. Config lives in the
  # `release` environment: var TAP_APP_ID + secret TAP_APP_PRIVATE_KEY. If the App isn't
  # configured the formula is rendered but the push is skipped (fail-safe).
  bump-tap:
    needs: [gate, release]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: render formula
        run: python3 packaging/homebrew/render_formula.py "${{ needs.gate.outputs.version }}"
      - name: mint short-lived tap token (GitHub App)
        id: tap
        if: ${{ vars.TAP_APP_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: team-hlab
          repositories: homebrew-keel
      - name: warn if tap App unconfigured
        if: ${{ vars.TAP_APP_ID == '' }}
        run: echo "::warning::Tap GitHub App not configured — formula rendered but NOT pushed. See docs/RELEASING.md."
      - name: push to tap
        if: ${{ vars.TAP_APP_ID != '' }}
        env:
          GH_TOKEN: ${{ steps.tap.outputs.token }}
          SLUG: ${{ steps.tap.outputs.app-slug }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/team-hlab/homebrew-keel.git" tap
          mkdir -p tap/Formula
          cp packaging/homebrew/keel.rb tap/Formula/keel.rb
          cd tap
          git config user.name "${SLUG}[bot]"
          git config user.email "${SLUG}[bot]@users.noreply.github.com"
          git add Formula/keel.rb
          git commit -m "keel ${{ needs.gate.outputs.version }}" || exit 0
          git push
