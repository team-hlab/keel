name: release

# Merge-triggered release: when a PR lands on develop and bumps the version in
# Cargo.toml, build the binaries, publish a GitHub Release, and update the Homebrew tap.
# A normal merge (no version change) is a no-op. Manual run available via workflow_dispatch.
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

# serialize releases so two quick merges can't race to publish the same tag
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -E '^version' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$version already released — nothing to do."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "v$version is new — releasing."
          fi

  build:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - run: tar -C target/${{ matrix.target }}/release -czf keel-${{ matrix.target }}.tar.gz keel
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: keel-*.tar.gz

  release:
    needs: [gate, build]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # only this job creates the tag + release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.gate.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true

  # Update the Homebrew tap. Requires a TAP_TOKEN secret (PAT with Contents:write on
  # team-hlab/homebrew-keel) — the push is skipped if it's unset.
  bump-tap:
    needs: [gate, release]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: render formula
        run: python3 packaging/homebrew/render_formula.py "${{ needs.gate.outputs.version }}"
      - name: warn if TAP_TOKEN unset
        if: ${{ env.GH_TOKEN == '' }}
        run: echo "::warning::TAP_TOKEN not set — formula rendered but NOT pushed. Update team-hlab/homebrew-keel manually (see docs/RELEASING.md)."
      - name: push to tap
        if: ${{ env.GH_TOKEN != '' }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/team-hlab/homebrew-keel.git" tap
          mkdir -p tap/Formula
          cp packaging/homebrew/keel.rb tap/Formula/keel.rb
          cd tap
          git config user.name "keel-release"
          git config user.email "keel-release@users.noreply.github.com"
          git add Formula/keel.rb
          git commit -m "keel ${{ needs.gate.outputs.version }}" || exit 0
          git push
